name: Kontrola bytov

on:
  schedule:
    - cron: "*/15 * * * *"   # každých 15 minút (GitHub môže beh trochu oneskoriť)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Zber inzerátov
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          TEST_NOTIFY: ${{ github.event_name == 'workflow_dispatch' }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python scraper/scrape.py

      - name: Uložiť zmeny
        if: always()
        run: |
          git config user.name "byty-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/state.json
          if [ -f docs/data/listings.enc.json ]; then git add docs/data/listings.enc.json; fi
          if [ -f docs/data/listings.json ]; then git add docs/data/listings.json; else git rm -q --cached --ignore-unmatch docs/data/listings.json; fi
          git diff --cached --quiet || (git commit -m "Aktualizácia ponúk" && git push)

      - uses: actions/configure-pages@v5
        if: always()
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: docs
      - id: deploy
        if: always()
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Opakovať nasadenie webu
        if: always() && steps.deploy.outcome == 'failure'
        continue-on-error: true
        run: sleep 20
      - id: deploy2
        if: always() && steps.deploy.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
